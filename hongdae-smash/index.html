<style>
/* Layout: full-screen 3D map; compact HUD chips on top, icon buttons on the right, one-row weapon bar at the bottom. Single committed daylight look. */
:root{
  --sky-top:#9fbbd6;
  --sky-low:#e3e7ec;
  --ink:#121a33;
  --glass:rgba(255,255,255,.86);
  --glass-dark:rgba(18,26,51,.84);
  --hot:#ff5130;
  --muted:#5f6577;
  --line:rgba(18,26,51,.12);
  --display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky-low); color:var(--ink); font-family:var(--body); overflow:hidden; -webkit-tap-highlight-color:transparent}
.game{position:relative; height:100%; overflow:hidden; background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-low) 55%); user-select:none; -webkit-user-select:none}
canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
.labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.lab{position:absolute; left:0; top:0; white-space:nowrap; background:var(--glass-dark); color:#fff; font:800 9.5px/1 var(--body); padding:3px 5px; border-radius:5px; will-change:transform}
.lab.dead{background:rgba(95,101,119,.7); text-decoration:line-through}
.lab.poi{background:#2f6fd6}
.flash{position:absolute; inset:0; background:#fffaf0; opacity:0; pointer-events:none}
.tint{position:absolute; inset:0; background:#ff8a3c; mix-blend-mode:multiply; opacity:0; pointer-events:none}
.ui{position:absolute; inset:0; pointer-events:none; padding-left:max(10px, env(safe-area-inset-left, 0px)); padding-right:max(10px, env(safe-area-inset-right, 0px)); padding-block:10px}
.ui > *{pointer-events:auto}
.top{position:absolute; top:10px; left:max(10px, env(safe-area-inset-left, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none}
.chip{background:var(--glass-dark); color:#fff; border-radius:9px; padding:5px 8px; font:800 11px var(--body); font-variant-numeric:tabular-nums; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.chip b{font-family:var(--display); font-weight:400; font-size:13px; letter-spacing:.01em}
.title{display:flex; flex-direction:column; gap:2px}
.title .t{font-family:var(--display); font-weight:400; font-size:14px}
.title .s{opacity:.75; font-size:10px}
.scorebox{display:flex; flex-direction:column; align-items:flex-end; gap:4px}
.score{font-family:var(--display); font-size:17px; padding:4px 9px}
.score small{font:800 9px var(--body); opacity:.65; letter-spacing:.1em; margin-right:5px; vertical-align:2px}
.combo{font-family:var(--display); color:var(--hot); font-size:19px; text-shadow:0 2px 0 #fff, 0 0 10px rgba(255,255,255,.9); min-height:22px}
.combo.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.side{position:absolute; right:max(10px, env(safe-area-inset-right, 0px)); bottom:calc(76px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:8px}
.ib{width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--glass); display:grid; place-items:center; cursor:pointer; padding:0; color:var(--ink); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 2px 8px rgba(18,26,51,.12)}
.ib svg{width:19px; height:19px}
.ib:disabled{opacity:.4; cursor:default}
.bar{position:absolute; left:max(10px, env(safe-area-inset-left, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); bottom:calc(10px + env(safe-area-inset-bottom, 0px)); margin:0 auto; max-width:460px; display:grid; grid-template-columns:repeat(6,1fr); gap:4px; padding:5px; border-radius:16px; background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 4px 18px rgba(18,26,51,.16)}
.tool{appearance:none; border:0; background:transparent; border-radius:11px; padding:6px 0 5px; display:flex; flex-direction:column; align-items:center; gap:2px; font:800 10px var(--body); color:var(--ink); cursor:pointer; min-width:0}
.tool svg{width:21px; height:21px}
.tool[aria-pressed="true"]{background:var(--ink); color:#fff}
.tool[aria-pressed="true"] svg [data-ink]{stroke:#fff}
.tool[aria-pressed="true"] svg [data-fill]{fill:#fff}
.tool:focus-visible,.ib:focus-visible{outline:2px solid var(--hot); outline-offset:2px}
.toast{position:absolute; left:50%; top:calc(58px + env(safe-area-inset-top, 0px)); transform:translateX(-50%); max-width:calc(100% - 32px); background:var(--glass-dark); color:#fff; font:700 11.5px/1.4 var(--body); padding:6px 10px; border-radius:9px; text-align:center; pointer-events:none; transition:opacity .4s}
.toast.hide{opacity:0}
.attr{position:absolute; left:max(10px, env(safe-area-inset-left, 0px)); bottom:calc(76px + env(safe-area-inset-bottom, 0px)); font-size:9px; color:#3d4357; background:rgba(255,255,255,.72); padding:2px 5px; border-radius:5px}
.attr a{color:inherit}
.err{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; font-weight:700; color:var(--muted)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>
</head>

{

// core destruction: hole of radius r at p; everything above the hole falls
function blast(cx, cy, cz, r, o = {}){
  const push = o.push ?? 1, maxP = o.maxP ?? 300, dx0 = o.dx || 0, dz0 = o.dz || 0, dustP = o.dust ?? 0.12;
  let removed = 0, made = 0, dusted = 0; const r2 = r*r*1.3;
  eachNear(cx, cz, r*1.15, c => {
    const h = H[c]; if (h <= 0) return;
    const dx = X[c]-cx, dz = Z[c]-cz, d2 = dx*dx+dz*dz; if (d2 > r2) return;
    const rr = r*(0.82+rnd()*0.3); if (d2 > rr*rr) return;
    const lo = cy - Math.sqrt(rr*rr - d2); if (lo >= h) return;
    let nt = Math.max(0, lo); if (nt < 1.5) nt = 0;
    const rem = h - nt; if (rem < 0.2) return;
    H[c] = nt; setCell(c); removed += rem*SZ[c]*SZ[c];
    const d = Math.sqrt(d2) || 1, f = Math.max(0, 1 - d/r), col = bCol[BI[c]];
    const n = Math.min(4, Math.ceil(rem/7));
    for (let k=0;k<n && made<maxP;k++, made++){
      const y = nt + rnd()*rem, near = Math.abs(y-cy) < rr;
      const sp = near ? (8 + rnd()*20)*(0.35+f)*push : 1 + rnd()*2.5;
      spawnDeb(X[c]+(rnd()-.5)*SZ[c], y, Z[c]+(rnd()-.5)*SZ[c], dx/d*sp + dx0 + (rnd()-.5)*4, near ? 4+rnd()*14*f*push : rnd()*2, dz/d*sp + dz0 + (rnd()-.5)*4, 0.8+rnd()*2.2, col);
    }
    if (rem > 6 && rnd() < dustP && dusted < 40){ dusted++; emit('dust', X[c], nt + 2 + rnd()*4, Z[c], (rnd()-.5)*6, 1+rnd()*2, (rnd()-.5)*6, 1 + rem/30); }
  });
  burnTrees(cx, cz, r*0.9);

}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  const rc = cv.getBoundingClientRect();
  ndc.set(((e.clientX-rc.left)/rc.width)*2-1, -((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  if (d.y > -1e-4) return null;
  const tg = -o.y/d.y; let t = Math.max(0, (o.y-170)/-d.y);
  for (; t < tg; t += 1.2){
    const px = o.x+d.x*t, py = o.y+d.y*t, pz = o.z+d.z*t;
    if (px < bb.x0 || px > bb.x1 || pz < bb.z0 || pz > bb.z1) continue;
    let hit = -1;
    eachNear(px, pz, 4, c => { if (hit >= 0 || py >= H[c]) return; const dx = px-X[c], dz = pz-Z[c], hs = SZ[c]/2;
      const lx = dx*RC[c] - dz*RS[c], lz = dx*RS[c] + dz*RC[c]; if (Math.abs(lx) < hs && Math.abs(lz) < hs) hit = c; });
    if (hit >= 0) return V3(px, py, pz);
  }
  const g = V3(o.x+d.x*tg, 0, o.z+d.z*tg);
  return (g.x < bb.x0 || g.x > bb.x1 || g.z < bb.z0 || g.z > bb.z1) ? null : g;
}

cv.addEventListener('pointerdown', e => {
  ptrs++;
  if (!tool) return;
  if (ptrs > 1){ laserOn = false; batOn = false; bat.visible = false; return; }
  const p = pick(e); if (!p) return;
  snapshot();
  if (tool === 'bomb') bomb(p);
  else if (tool === 'bat'){ batOn = true; lastBat = p; batSwing = -0.5; batHit(p, 0, 0, 0); }
  else if (tool === 'laser'){ laserOn = true; laserPt = p; }
  else if (tool === 'meteor') meteor(p);
  else if (tool === 'quake') startQuake(p);
  else if (tool === 'nuke') nuke(p);
});
cv.addEventListener('pointermove', e => {
  if (!tool || ptrs > 1) return;
  if (laserOn){ const p = pick(e); if (p) laserPt = p; }
  if (batOn && lastBat){
    const p = pick(e); if (!p) return;
    const dx = p.x-lastBat.x, dz = p.z-lastBat.z, len = Math.hypot(dx, dz);
    if (len < 2) return;
    const f = V3(p.x - camera.position.x, 0, p.z - camera.position.z).normalize();
    const sideMove = (dx*(-f.z) + dz*f.x) / len;
    batSwing = Math.max(-1.1, Math.min(1.1, batSwing + sideMove*len*0.012));
    const steps = Math.ceil(len/5), sp = Math.min(len, 50)*0.7;
    for (let k=1;k<=steps;k++){ const t = k/steps; batHit(V3(lastBat.x+dx*t, lastBat.y+(p.y-lastBat.y)*t, lastBat.z+dz*t), dx/len, dz/len, sp); }
    lastBat = p;
  }
});

    }
    if (ok !== tg.shown){ tg.el.style.display = ok ? '' : 'none'; tg.shown = ok; }
    if (ok) tg.el.style.transform = `translate(${(x - tg.w/2).toFixed(1)}px, ${(yy - tg.h).toFixed(1)}px)`;
  }
}

let lastLab = '';
function updateHud(force){
  $score.textContent = score.toLocaleString('ko-KR');
  ents.forEach(o => { o.v = 0; o.top = 0; });
  const bLeft = new Float32Array(D.b.length);
  for (let c=0;c<N;c++){ bLeft[BI[c]] += H[c]*SZ[c]*SZ[c]; const e = E[c]; if (e < 0) continue; const o = ents[e]; o.v += H[c]; if (H[c] > o.top) o.top = H[c]; }
  let downB = 0; for (let i=0;i<D.b.length;i++) if (bLeft[i] < bVol[i]*0.15) downB++;
  let down = 0;
  ents.forEach((o, i) => { const dead = o.v/o.vol < 0.15; if (dead) down++; if (dead !== o.dead){ o.dead = dead; tags.find(t => t.ent === o).el.classList.toggle('dead', dead); } });
  $count.textContent = `붕괴 ${downB.toLocaleString('ko-KR')}채 · 캠퍼스 ${down}/${ents.length}`;
  const now = performance.now();
  if (now - comboT > 1500) combo = 0;
  let lab = '';
  if (downB === D.b.length) lab = '홍대 전멸';
  else if (combo >= 150000) lab = '지도에서 삭제됨';
  else if (combo >= 30000) lab = '초토화!!';
  else if (combo >= 5000) lab = '산산조각!';
  else if (combo >= 600) lab = '와장창!';
  if (lab !== lastLab || force){
    if (lab){ $combo.textContent = lab; $combo.classList.remove('pop'); void $combo.offsetWidth; $combo.classList.add('pop'); }
    else if (now - comboT > 2200) $combo.textContent = '';
    lastLab = lab;
  }
}

// camera
const controls = new THREE.OrbitControls(camera, cv);
controls.enableDamping = true; controls.dampingFactor = 0.09; controls.screenSpacePanning = false;
controls.minDistance = 40; controls.maxDistance = 1700; controls.maxPolarAngle = 1.42; controls.panSpeed = 1.1;
function applyControls(){
  if (tool){ controls.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE }; controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE }; cv.style.cursor = 'crosshair'; }
  else { controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE }; controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN }; cv.style.cursor = 'grab'; }
}
applyControls();
const HOME_T = V3(20, 0, 0);
function home(){
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const dist = Math.max(560/(2*Math.tan(vf/2))*0.9, 340/(2*Math.tan(hf/2))*1.05);
  camera.position.copy(HOME_T).addScaledVector(V3(-0.16, 0.8, 0.58).normalize(), Math.min(dist, 1500));
  controls.target.copy(HOME_T); controls.update();
}
$('home').addEventListener('click', home);

let W = 0, Hh = 0;
function resize(){
  W = stage.clientWidth; Hh = stage.clientHeight;
  renderer.setSize(W, Hh, false); camera.aspect = W/Hh; camera.updateProjectionMatrix();
  const us = Hh*renderer.getPixelRatio() / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  FIRE.mat.uniforms.uScale.value = us; SMOKE.mat.uniforms.uScale.value = us;
}
window.addEventListener('resize', resize);
resize(); home(); updateHud(true);

// ================= loop =================
const clock = new THREE.Clock(); let frame = 0, time = 0; const camOff = new THREE.Vector3();
let perfAcc = 0, perfN = 0, quality = 2;
function checkPerf(dt){
  if (quality === 0 || frame < 30) return; perfAcc += dt; perfN++;
  if (perfN < 90) return; const avg = perfAcc/perfN; perfAcc = 0; perfN = 0;
  if (avg > 1/26){ quality--; if (quality === 1){ renderer.setPixelRatio(1); resize(); } else { sun.castShadow = false; renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); } }
}
function loop(){
  const rawDt = clock.getDelta(); checkPerf(rawDt); const dt = Math.min(rawDt, 0.05); time += dt;
  if (laserOn && laserPt){
    const from = V3(laserPt.x + 260, 900, laserPt.z - 200);
    placeBeam(from, laserPt, time);
    blast(laserPt.x, laserPt.y, laserPt.z, 4.6, { maxP: 5, push: .6, dust: .05 });
    for (let n=0;n<3;n++) emit('spark', laserPt.x, laserPt.y+1, laserPt.z, (rnd()-.5)*30, 8+rnd()*18, (rnd()-.5)*30, 1);
    emit('fire', laserPt.x, laserPt.y+1, laserPt.z, (rnd()-.5)*4, 6, (rnd()-.5)*4, .7);
    if (rnd() < .35) emit('smoke', laserPt.x, laserPt.y+3, laserPt.z, (rnd()-.5)*3, 6, (rnd()-.5)*3, .8);
    if (frame % 3 === 0) addScorch({ t: 'burn', x: laserPt.x, z: laserPt.z, r: 4, a: .45 });
    flashLight(laserPt.clone().setY(laserPt.y + 6), 0xff4060, 2.2, 90);
    shakeIt(0.12);
  } else if (beamCore.visible){ beamOuter.visible = beamMid.visible = beamCore.visible = beamHit.visible = false; }
  stepQuake(dt);
  for (let i=fx.length-1;i>=0;i--) if (!fx[i](dt)) fx.splice(i,1);
  stepDebris(dt); stepPool(FIRE, dt); stepPool(SMOKE, dt);
  flushCells();
  if (scorchDirty && frame % 4 === 0){ stex.needsUpdate = true; scorchDirty = false; }
  lights.forEach(l => l.intensity *= Math.pow(0.015, dt));
  controls.update();
  const T = controls.target; T.x = Math.max(bb.x0, Math.min(bb.x1, T.x)); T.z = Math.max(bb.z0, Math.min(bb.z1, T.z)); T.y = 0;
  const dist = camera.position.distanceTo(T), ext = Math.min(520, Math.max(220, dist*0.7));
  sun.target.position.copy(T); sun.position.copy(T).add(SUN_OFF);
  const scm = sun.shadow.camera; if (Math.abs(scm.right - ext) > 20){ scm.left = -ext; scm.right = ext; scm.top = ext; scm.bottom = -ext; scm.updateProjectionMatrix(); }
  if (shake){ camOff.set(rnd()-.5, rnd()-.5, rnd()-.5).multiplyScalar(shake*Math.min(14, dist*0.02)); camera.position.add(camOff); }
  renderer.render(scene, camera);
  if (shake){ camera.position.sub(camOff); shake *= Math.pow(0.05, dt); if (shake < 0.02) shake = 0; }
  if (++frame % 10 === 0) updateHud(false);
  placeLabels(W, Hh);
  requestAnimationFrame(loop);
}
loop();
})();
</script>
